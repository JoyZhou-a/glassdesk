[project]
name = "glassdesk"
version = "0.1.0"
description = "GlassDesk — 玻璃企业英文客服知识助手（项目 A）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.1",
    "loguru>=0.7.2",
    "pymysql>=1.1.1",
    "redis>=5.0.8",
    "pymilvus>=2.4,<2.5",
    "setuptools<80",
    "openai>=1.40",
    # 语料构建（M1）：Excel / Word / PDF 的生成与校验
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pymupdf>=1.24",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

# 机器学习依赖单独一组：M0/M1 阶段不安装，等 M2 入库时再 `uv sync --extra ml`
[project.optional-dependencies]
ml = [
    "torch>=2.7",
    "transformers>=4.44,<5",
    "sentence-transformers>=3.0",
    "milvus-model>=0.2.12",
    "pandas>=2.2",
    "openpyxl>=3.1",
]

# RTX 5060 Ti 是 Blackwell(sm_120)，需要 CUDA 12.8 轮子，不能用默认 PyPI 的 CPU 版
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glassdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = '-ra --strict-markers -m "not integration"'
markers = [
    "integration: 需要真实外部服务（Milvus/MySQL/Redis/LLM），默认跳过",
    "slow: 耗时超过 5 秒",
]

[tool.coverage.run]
source = ["src/glassdesk"]
