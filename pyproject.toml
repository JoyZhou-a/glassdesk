[project]
name = "glassdesk"
version = "0.1.0"
description = "GlassDesk — 玻璃企业英文客服知识助手（项目 A）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.1",
    "loguru>=0.7.2",
    "pymysql>=1.1.1",
    "redis>=5.0.8",
    "pymilvus>=2.4,<2.5",
    "setuptools<80",
    "openai>=1.40",
    # 语料构建（M1）：Excel / Word / PDF 的生成与校验
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pymupdf>=1.24",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

# 机器学习依赖单独一组：M0/M1a 阶段不安装，做索引时 `uv sync --extra ml`
# 注意：**不装 milvus-model**。它的 BGEM3EmbeddingFunction 依赖 FlagEmbedding，
# 加载时会尝试联网并长时间挂住；我们改为直接用 transformers 实现 dense/sparse。
[project.optional-dependencies]
ml = [
    "torch>=2.7",
    "transformers>=4.44,<5",
    "sentence-transformers>=3.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
]

# GPU 说明（重要，请先读完再跑 uv sync）
# -------------------------------------
# RTX 5060 Ti 是 Blackwell(sm_120)，需要 CUDA 12.8+ 的 torch 轮子。
#
# 实测：国内从 download.pytorch.org 拉取会**连接建立但不传数据**；
# 阿里云 pytorch-wheels 镜像只有 0.54 MB/s（3.4 GB 需约 105 分钟）。
#
# 采用的办法：复用机器上已有的 conda 环境（bert_gpu，torch 2.13.0+cu130，
# Python 3.12.13 与本项目 3.12.14 同一小版本，二进制兼容），
# 把 torch / torchgen / functorch 复制进本项目的 .venv。
#
#   pwsh scripts/use_conda_torch.ps1
#
# ⚠️ `uv sync --extra ml` 会重新装回 PyPI 的 CPU 版 torch。
#    每次 sync 之后都要重跑上面的脚本。
#
# 实测效果（275 条 chunk）：CPU 约 1.5 条/秒，CUDA 约 209 条/秒（≈140 倍）。
#
# 若将来能正常下载官方轮子，可改用下面两段（取消注释）：
#   [[tool.uv.index]]
#   name = "pytorch-cu128"
#   url = "https://mirrors.aliyun.com/pytorch-wheels/cu128/"
#   format = "flat"
#   explicit = true
#
#   [tool.uv.sources]
#   torch = [{ index = "pytorch-cu128" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glassdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = '-ra --strict-markers -m "not integration"'
markers = [
    "integration: 需要真实外部服务（Milvus/MySQL/Redis/LLM），默认跳过",
    "slow: 耗时超过 5 秒",
]

[tool.coverage.run]
source = ["src/glassdesk"]
